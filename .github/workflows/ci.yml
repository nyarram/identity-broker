name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Java unit and integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      # Integration tests start Postgres with Testcontainers, using the runner's Docker
      - run: ./gradlew test
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests/"

  typescript:
    name: Agent SDK, CLI and demo (typecheck + Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  compose-smoke:
    name: Docker Compose smoke test and demo
    runs-on: ubuntu-latest
    needs: [test, typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: docker compose up -d --build --wait
      - run: node scripts/smoke-test.mjs
      # Fails if scene 4's injection gets past the broker
      - run: npm run demo -- --replay
      - run: npm run demo -- --replay --no-broker
      - name: Service logs
        if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
