server:
  port: 8081

spring:
  application:
    name: orders-api

orders:
  # Must match the broker's issuer and the resource id agents request tokens for
  issuer: ${ORDERS_ISSUER:http://localhost:9000}
  audience: ${ORDERS_API_AUDIENCE:https://orders-api.example}
  jwk-set-uri: ${ORDERS_JWK_SET_URI:http://localhost:9000/oauth2/jwks}
  # Introspection before writes; the credentials must match the broker's resource config
  introspection-uri: ${ORDERS_INTROSPECTION_URI:http://localhost:9000/oauth2/introspect}
  client-id: orders-api
  client-secret: ${ORDERS_API_CLIENT_SECRET:orders-api-dev-secret}
  # All-access static key for the demo's --no-broker contrast. Empty means disabled.
  demo-api-key: ${ORDERS_DEMO_API_KEY:}
